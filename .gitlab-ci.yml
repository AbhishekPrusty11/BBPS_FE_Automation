default:
  image: mcr.microsoft.com/playwright:v1.61.1-jammy

stages:
  - install
  - test

variables:
  NODE_ENV: test

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .cache/ms-playwright/

install_dependencies:
  stage: install
  tags:
    - k8-onprem-deploy-runner
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 week

run_fe_tests:
  stage: test
  tags:
    - k8-onprem-deploy-runner
  dependencies:
    - install_dependencies
  script:
    - |
      if [ -n "$TESTCASE_NAME" ] && [ "$TESTCASE_NAME" != "all" ]; then
        npx playwright test --grep "$TESTCASE_NAME"
      else
        npx playwright test
      fi
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: test-results/junit.xml
    expire_in: 1 week