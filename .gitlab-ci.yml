default:
  image: mcr.microsoft.com/playwright:v1.61.1-jammy

stages:
  - install
  - test

variables:
  NODE_ENV: test

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - ~/.cache/ms-playwright/

install_dependencies:
  stage: install
  tags:
    - k8-deploy-runner
  script:
    - echo "Installing dependencies..."
    - npm install
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 week
  rules:
    - when: always

run_api_tests:
  stage: test
  timeout: 30m
  allow_failure: true
  tags:
    - k8-deploy-runner   
  dependencies:
    - install_dependencies
  script:
    - echo "Running ${TESTCASE_NAME:-all} test cases..."
    - |
      if [ "$TESTCASE_NAME" != "" ] && [ "$TESTCASE_NAME" != "all" ]; then
        npx playwright test --grep "$TESTCASE_NAME"
      else
        npx playwright test
      fi
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 week
  rules:
    - when: always
